services:
  backend:
    image: ghcr.io/jasanpreetn9/logpose-backend:latest
    build: ./backend          # used by `docker compose up --build` for local dev
    restart: unless-stopped
    environment:
      CONFIG_PATH: /app/config.yml
      DATA_DIR: /app/data
    volumes:
      - ./config.yml:/app/config.yml:ro
      - ./data:/app/data
      # Mount your actual media paths — must match libraryPath / downloadPath in config.yml
      - /Volumes/hdd_media/anime/One Pace:/media/library
      - /Volumes/hdd_downloads/complete:/media/downloads
    ports:
      - "8989:8989"

  frontend:
    image: ghcr.io/jasanpreetn9/logpose-frontend:latest
    build: ./frontend          # used by `docker compose up --build` for local dev
    restart: unless-stopped
    # Only needed if you renamed the backend service above or changed its
    # listen port (config.yml's `port` / the OP_PORT env var) — defaults
    # already match this file as written.
    # environment:
    #   BACKEND_HOST: backend
    #   BACKEND_PORT: "8989"
    ports:
      - "3000:80"
    depends_on:
      - backend
